replicaCount: 2

image:
  repository: quay.io/cbusse_openshift/seaplane-operator
  tag: ""
  pullPolicy: IfNotPresent

awsRegion: ""
baseDomain: ""

# Cincinnati graph feed used to populate Channel status.releases.
channel:
  cincinnatiURL: https://api.openshift.com/api/upgrades_info/v1/graph
  arch: multi
  refreshInterval: 10m

# Optional regional Alertmanager base URL for lifecycle silence reconciliation.
# When unset, the silence reconciler is not started.
alertmanager:
  url: ""

# Optional development override for the control-plane-operator image. When set,
# every HostedCluster the operator creates is stamped with the
# hypershift.openshift.io/control-plane-operator-image annotation set to this
# value. When empty, no override is applied.
controlPlaneOperatorImage: ""

# ECR mirror configuration. When enabled, the operator sets imageContentSources
# on every HostedCluster and redirects ESO pull-secret target to baseSecretName
# so that ecr-creds-sync can write the merged credentials to pull-secret.
# All fields except baseSecretName are required when enabled is true.
ecrMirror:
  enabled: false
  registryAccount: ""
  registryRegion: ""
  repository: ""
  sources: ""
  baseSecretName: ""

postgres:
  secretName: postgres-dsn
  secretKey: dsn

serviceAccount:
  create: true
  name: seaplane-operator
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

compactor:
  enabled: true
  interval: 5m
  retention: 24h
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

nodeSelector: {}
tolerations: []
