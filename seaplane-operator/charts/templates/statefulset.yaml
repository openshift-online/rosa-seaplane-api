apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "seaplane-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seaplane-operator.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "seaplane-operator.fullname" . }}
  podManagementPolicy: Parallel
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "seaplane-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "seaplane-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "seaplane-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          args:
            - --aws-region={{ required "awsRegion is required" .Values.awsRegion }}
            - --base-domain={{ required "baseDomain is required" .Values.baseDomain }}
            - --cincinnati-url={{ .Values.channel.cincinnatiURL | quote }}
            - --cincinnati-arch={{ .Values.channel.arch | quote }}
            - --channel-refresh-interval={{ .Values.channel.refreshInterval | quote }}
            - --health-probe-bind-address=:8081
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName | default "postgres-dsn" }}
                  key: {{ .Values.postgres.secretKey | default "dsn" }}
            - name: REPLICA_COUNT
              value: {{ .Values.replicaCount | quote }}
            {{- if .Values.alertmanager.url }}
            - name: ALERTMANAGER_URL
              value: {{ .Values.alertmanager.url | quote }}
            {{- end }}
            {{- if .Values.controlPlaneOperatorImage }}
            - name: CONTROL_PLANE_OPERATOR_IMAGE
              value: {{ .Values.controlPlaneOperatorImage | quote }}
            {{- end }}
            {{- if .Values.ecrMirror.enabled }}
            - name: ECR_MIRROR_ENABLED
              value: "true"
            - name: ECR_MIRROR_REGISTRY_ACCOUNT
              value: {{ .Values.ecrMirror.registryAccount | quote }}
            - name: ECR_MIRROR_REGISTRY_REGION
              value: {{ .Values.ecrMirror.registryRegion | quote }}
            - name: ECR_MIRROR_REPOSITORY
              value: {{ .Values.ecrMirror.repository | quote }}
            - name: ECR_MIRROR_SOURCES
              value: {{ .Values.ecrMirror.sources | quote }}
            - name: ECR_MIRROR_BASE_SECRET_NAME
              value: {{ .Values.ecrMirror.baseSecretName | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
