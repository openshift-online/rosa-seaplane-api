apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaplane-db-dsn
  namespace: {{ .Values.platformApi.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.platformApi.seaplanedb.secretName | default "seaplane-db-dsn" }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.platformApi.seaplanedb.secretKey | default "dsn" }}
      remoteRef:
        key: {{ .Values.global.cluster_name }}-seaplane-db-dsn
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
