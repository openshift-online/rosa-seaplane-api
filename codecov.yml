codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "vendor/**"
  - "**/zz_generated*.go"
  - "**/*_generated.go"
  - "**/fake_*.go"
  - "**/mock_*.go"
  - "**/*_mock.go"
  - "**/internal/authztest/**"
  - "docs/**"
  - "hack/tools/**"
  - "test/**"

flags:
  seaplane-api:
    carryforward: true
  seaplane-operator:
    carryforward: true
  api-codegen:
    carryforward: true
  clientset:
    carryforward: true

comment:
  layout: "header,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
